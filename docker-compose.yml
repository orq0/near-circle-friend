# Near-Circle local development stack — four project-owned services.
# The OSM-compatible map tile provider is external by design (see MAP_TILE_URL)
# and is intentionally NOT a fifth container here.
name: near-circle

services:
  near-circle-web:
    container_name: near-circle-web
    build:
      context: ./apps/web
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ""
      # In-network API address for the Vite /api proxy. `localhost` here would
      # be the web container itself, so native dev keeps the localhost
      # default from apps/web/vite.config.ts instead.
      VITE_API_PROXY_TARGET: "http://near-circle-api:3001"
    depends_on:
      near-circle-api:
        condition: service_started
    networks:
      - near-circle-net

  near-circle-api:
    container_name: near-circle-api
    build:
      context: ./apps/api
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      API_PORT: "3001"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-near_circle}:${POSTGRES_PASSWORD:-near_circle_dev_password}@near-circle-db:5432/${POSTGRES_DB:-near_circle}"
      ROUTING_PROVIDER: "${ROUTING_PROVIDER:-osrm}"
      ROUTING_WALK_URL: "${ROUTING_WALK_URL:-http://near-circle-routing-walk:5000}"
      MAP_TILE_URL: "${MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}"
      MAP_TILE_ATTRIBUTION: "${MAP_TILE_ATTRIBUTION:-© OpenStreetMap contributors}"
      DEFAULT_STRIDE_M: "${DEFAULT_STRIDE_M:-0.75}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      META_MODEL_NAME: "${META_MODEL_NAME:-muse-spark-1.3}"
      META_MODEL_BASE_URL: "${META_MODEL_BASE_URL:-https://api.meta.ai/v1}"
      AI_CIRCLE_ENABLED: "${AI_CIRCLE_ENABLED:-1}"
      AI_CIRCLE_DEMO_MODE: "${AI_CIRCLE_DEMO_MODE:-1}"
      AI_CIRCLE_TIMEOUT_MS: "${AI_CIRCLE_TIMEOUT_MS:-20000}"
      AI_CIRCLE_MAX_TOKENS: "${AI_CIRCLE_MAX_TOKENS:-2048}"
      AI_CIRCLE_COOLDOWN_DAYS: "${AI_CIRCLE_COOLDOWN_DAYS:-14}"
      AI_CIRCLE_USER_REFRESH_PER_DAY: "${AI_CIRCLE_USER_REFRESH_PER_DAY:-1}"
      AI_CIRCLE_ADVICE_TTL_MIN: "${AI_CIRCLE_ADVICE_TTL_MIN:-30}"
      AI_CIRCLE_ADVICE_PER_USER_DAY: "${AI_CIRCLE_ADVICE_PER_USER_DAY:-20}"
      AI_CIRCLE_ADVICE_PAIR_WINDOW_HOURS: "${AI_CIRCLE_ADVICE_PAIR_WINDOW_HOURS:-6}"
      AI_CIRCLE_DAILY_REQUEST_BUDGET: "${AI_CIRCLE_DAILY_REQUEST_BUDGET:-100}"
    depends_on:
      near-circle-db:
        condition: service_healthy
    networks:
      - near-circle-net

  near-circle-db:
    container_name: near-circle-db
    image: postgis/postgis:16-3.4
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-near_circle}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-near_circle_dev_password}"
      POSTGRES_DB: "${POSTGRES_DB:-near_circle}"
    volumes:
      - near-circle-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-near_circle} -d ${POSTGRES_DB:-near_circle}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - near-circle-net

  # Independent pedestrian routing API. Gated behind the `routing` Compose
  # profile: plain `up` skips it while no foot-profile graph exists (Phase 1).
  # Once the Phase 3 bootstrap prepares routing/data/near-circle.osrm.* (the
  # .osrm path is a basename prefix; v5.27 writes no bare .osrm file), startall
  # enables the profile automatically. See routing/README.md. restart is "no"
  # so an unprepared graph shows as stopped, never as a fake-healthy router.
  near-circle-routing-walk:
    container_name: near-circle-routing-walk
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["routing"]
    command: ["osrm-routed", "--algorithm", "mld", "/data/near-circle.osrm"]
    ports:
      - "${ROUTING_WALK_PORT:-5002}:5000"
    volumes:
      - ./routing/data:/data:ro
    restart: "no"
    networks:
      - near-circle-net

volumes:
  near-circle-db-data:

networks:
  near-circle-net:
    driver: bridge
